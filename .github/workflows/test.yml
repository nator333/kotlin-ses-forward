name: Test

# Branch work is covered by the pull_request trigger, which builds the merge
# result rather than the branch tip in isolation. push is limited to master so
# it only covers what has already landed. Matching "**" here instead would fire
# a second, identical run for every commit on a branch that has a PR open -
# concurrency does not collapse those, because the two events carry different
# github.ref values (refs/heads/... vs refs/pull/N/merge).
on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref, so a rapid series of pushes
# only pays for the newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is a binary in the repo; verify it matches an
      # official Gradle release before executing it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # `build` used to depend on both clean and buildZip with no ordering
      # between them, so clean deleted the artifact buildZip had produced.
      # Assert against the exact path serverless.yml declares, so a version
      # drift between build.gradle and serverless.yml also fails here.
      # spotlessCheck is excluded: its ratchetFrom needs full git history,
      # and formatting drift should not fail a dependency bump.
      - name: Verify build produces the deploy artifact
        run: |
          ./gradlew build -x spotlessCheck --stacktrace
          version=$(grep -E '^[[:space:]]+version:' serverless.yml | head -1 | awk '{print $2}')
          artifact="app/build/distributions/app-${version}.zip"
          if [ ! -f "$artifact" ]; then
            echo "::error::serverless.yml declares $artifact but the build did not produce it"
            ls -R app/build/distributions 2>/dev/null || echo "(no distributions directory)"
            exit 1
          fi
          echo "OK: $artifact ($(du -h "$artifact" | cut -f1))"

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests/test
            app/build/test-results/test
          retention-days: 14
          if-no-files-found: ignore
