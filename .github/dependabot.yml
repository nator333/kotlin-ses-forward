version: 2

updates:
  - package-ecosystem: "gradle"
    # A single "/" covers the whole build: the Gradle scan picks up
    # settings.gradle here plus the subproject build files (app/build.gradle).
    # Listing "/app" as well made every ungrouped bump open twice.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
          - "com.amazonaws:*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*:*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*:*"
          - "org.jetbrains.kotlin.jvm"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
