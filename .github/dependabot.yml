version: 2

updates:
  - package-ecosystem: "gradle"
    # Root holds settings.gradle plugins; app/ holds the application dependencies.
    directories:
      - "/"
      - "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
          - "com.amazonaws:*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*:*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*:*"
          - "org.jetbrains.kotlin.jvm"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
